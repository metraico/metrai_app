services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: metrai_app_backend
    environment:
      SIM_ENGINE_URL: "${DOCKER_SIM_ENGINE_URL:-http://metrai_api:8000}"
      POSTGRES_DSN: "${DOCKER_POSTGRES_DSN:-postgresql://metrai:metrai_pass@metrai_postgres:5432/metrai}"
    ports:
      - "8080:8000"
    networks:
      - default
      - metrai_shared
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: metrai_app_frontend
    environment:
      BACKEND_URL: "${DOCKER_BACKEND_URL:-http://backend:8000}"
    ports:
      - "8503:8501"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
  metrai_shared:
    name: metrai_shared
    external: true
