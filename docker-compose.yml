services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: metrai_app_backend
    environment:
      SIM_ENGINE_URL: "${DOCKER_SIM_ENGINE_URL:-http://metrai_api:8000}"
      POSTGRES_DSN: "${DOCKER_POSTGRES_DSN:-postgresql://metrai:metrai_pass@metrai_postgres:5432/metrai}"
      JWT_SECRET: "${JWT_SECRET}"
    ports:
      - "8080:8000"
    networks:
      - default
      - metrai_shared
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend-nextjs:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
      args:
        NEXT_PUBLIC_BACKEND_URL: "${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}"
        NEXT_PUBLIC_ENGINE_URL: "${NEXT_PUBLIC_ENGINE_URL:-http://localhost:8000}"
    container_name: metrai_app_frontend_nextjs
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default

networks:
  default:
  metrai_shared:
    name: metrai_shared
    external: true
