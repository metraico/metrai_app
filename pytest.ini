[pytest]
testpaths = tests
addopts = --tb=short -q --strict-markers
markers =
    integration: tests that hit the live backend at BACKEND_URL (default http://localhost:8080)
    auth: tests that exercise auth/register/login/refresh/logout flow
    accounts: tests for /accounts and /switch-account
    metadata: tests for /entities, /mappings, /promos
    simulation: tests for simulation lifecycle proxy endpoints
