name: Deploy with Tests — metrai_app

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  backend-tests:
    name: Backend — pytest integration tests against live FastAPI + sim engine
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: metrai
          POSTGRES_USER: metrai
          POSTGRES_PASSWORD: metrai_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U metrai -d metrai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout metrai_app
        uses: actions/checkout@v4

      - name: Checkout metrai_simulation_engine
        uses: actions/checkout@v4
        with:
          repository: metraico/metrai_simulation_engine
          # Use the PR's source branch on the sim engine repo (falls back to the
          # branch being pushed on push events). Assumes matched branch names
          # across the two repos — the standard workflow here.
          ref: ${{ github.head_ref || github.ref_name }}
          path: metrai_simulation_engine
          token: ${{ secrets.METRAI_REPO_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply DB schema (engine repo)
        env:
          PGPASSWORD: metrai_pass
        run: |
          # Base schema
          psql -h localhost -p 5433 -U metrai -d metrai \
            -f metrai_simulation_engine/db/pg_init.sql
          # Apply every migration in lexicographic order. Migrations use
          # IF NOT EXISTS / IF EXISTS guards, so re-running them is a no-op.
          for f in metrai_simulation_engine/db/pg_migrate_*.sql; do
            echo "Applying $(basename "$f")"
            psql -h localhost -p 5433 -U metrai -d metrai -v ON_ERROR_STOP=1 -f "$f"
          done
          # Auth schema (metrai_app owns this one, not the sim engine)
          psql -h localhost -p 5433 -U metrai -d metrai -v ON_ERROR_STOP=1 \
            -f backend/migrations/001_auth.sql

      - name: Start sim engine (background)
        env:
          POSTGRES_DSN: postgresql://metrai:metrai_pass@localhost:5433/metrai
          JWT_SECRET: ci-jwt-secret-must-match-backend
          SAMPLE_DATA_DIR: ./metrai_simulation_engine/sample_data
        run: |
          pip install -r metrai_simulation_engine/requirements.txt
          cd metrai_simulation_engine
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/engine.log 2>&1 &
          cd ..
          # Wait for /health
          for i in {1..30}; do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done

      - name: Start app backend (background)
        env:
          POSTGRES_DSN: postgresql://metrai:metrai_pass@localhost:5433/metrai
          SIM_ENGINE_URL: http://localhost:8000
          JWT_SECRET: ci-jwt-secret-must-match-backend
        run: |
          nohup python -m uvicorn backend.main:app --host 0.0.0.0 --port 8080 \
            > /tmp/backend.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done

      - name: Run pytest
        env:
          BACKEND_URL: http://localhost:8080
          ENGINE_URL: http://localhost:8000
        run: |
          pytest tests/ -v --tb=short --junit-xml=tests/results.xml \
            --cov=backend --cov-report=xml --cov-report=term-missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            tests/results.xml
            coverage.xml
            /tmp/backend.log
            /tmp/engine.log

  frontend-build:
    name: Frontend — TypeScript type-check, ESLint, Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
          NEXT_PUBLIC_ENGINE_URL: http://localhost:8000
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Get runner IP
        id: ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Allow runner IP on port 22
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ip }}/32 \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ec2-user/metrai_app

            cat > .env <<'EOF'
            SIM_ENGINE_URL=${{ secrets.SIM_ENGINE_URL }}
            POSTGRES_DSN=${{ secrets.POSTGRES_DSN }}
            BACKEND_URL=http://backend:8000
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_ENGINE_URL=${{ secrets.NEXT_PUBLIC_ENGINE_URL }}
            EOF

            git pull origin dev
            docker-compose up -d --build --remove-orphans
            docker image prune -f

      - name: Remove runner IP from security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ip }}/32 \
            --region ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
